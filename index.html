<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Joyas Hermanas | Alta Joyería</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Playfair Display',serif;
  color:#e6d9b8;
  overflow-x:hidden;
}

/* VIDEO */
.video-bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}
.video-overlay{
  position:fixed;
  inset:0;
  background:rgba(20,18,14,.65);
  z-index:-1;
}

/* CONTENEDOR */
.container{
  max-width:1200px;
  margin:auto;
  padding:80px 20px;
  text-align:center;
}

h1{font-size:42px;letter-spacing:2px}
.subtitle{
  margin:10px 0 60px;
  font-size:14px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#d6caa5;
}

/* SECCIONES */
.sections{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  margin-bottom:80px;
}

.section-card{
  position:relative;
  height:280px;
  border-radius:22px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(230,217,184,.3);
}

.section-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.section-card span{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  font-size:20px;
  letter-spacing:3px;
  text-transform:uppercase;
}

/* CATÁLOGOS */
.catalog{
  display:none;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  margin-bottom:80px;
}

.catalog.active{
  display:grid;
}

.product{
  background:rgba(0,0,0,.45);
  border:1px solid rgba(230,217,184,.25);
  border-radius:22px;
  padding:18px;
  backdrop-filter:blur(8px);
}

.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:14px;
}

.product h3{
  font-size:16px;
  letter-spacing:1px;
  margin-bottom:6px;
}

.price{
  font-size:15px;
  margin-bottom:14px;
}

.buy{
  display:inline-block;
  padding:10px 28px;
  border-radius:30px;
  background:linear-gradient(135deg,#e6d9b8,#cdbb8a);
  color:#111;
  font-size:13px;
  letter-spacing:2px;
  text-decoration:none;
}

/* REDES */
.socials{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:40px;
}
.socials a{
  color:#e6d9b8;
  border:1px solid rgba(230,217,184,.4);
  padding:10px 22px;
  border-radius:30px;
  font-size:13px;
  letter-spacing:2px;
  text-decoration:none;
}

footer{
  text-align:center;
  font-size:12px;
  letter-spacing:1px;
  color:rgba(245,230,200,.6);
  margin-bottom:30px;
}

@media(max-width:600px){
  h1{font-size:32px}
}
</style>
</head>

<body>

<video class="video-bg" autoplay muted loop playsinline>
  <source src="anillo.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="container">
<h1>Joyas Hermanas</h1>
<div class="subtitle">Alta Joyería Colombiana</div>

<!-- SOLO 4 SECCIONES -->
<div class="sections">
  <div class="section-card" onclick="openCatalog('cadenas')">
    <img src="categoria-cadenas.jpg">
    <span>Cadenas</span>
  </div>

  <div class="section-card" onclick="openCatalog('pulseras')">
    <img src="categoria-pulseras.jpg">
    <span>Pulseras</span>
  </div>

  <div class="section-card" onclick="openCatalog('anillos-mujer')">
    <img src="categoria-mujer.jpg">
    <span>Anillos Mujer</span>
  </div>

  <div class="section-card" onclick="openCatalog('anillos-hombre')">
    <img src="categoria-hombre.jpg">
    <span>Anillos Hombre</span>
  </div>
</div>

<!-- CADENAS -->
<div id="cadenas" class="catalog">
  <div class="product">
    <img src="cadena1.jpg">
    <h3>Cadena 1</h3>
    <div class="price">$---</div>
    <a class="buy" href="https://wa.me/573XXXXXXXXX?text=¡Quiero%20comprar%20esta%20pieza!" target="_blank">Comprar</a>
  </div>
</div>

<!-- PULSERAS -->
<div id="pulseras" class="catalog">
  <div class="product">
    <img src="pulsera1.jpg">
    <h3>Pulsera 1</h3>
    <div class="price">$---</div>
    <a class="buy" href="https://wa.me/573XXXXXXXXX?text=¡Quiero%20comprar%20esta%20pieza!" target="_blank">Comprar</a>
  </div>
</div>

<!-- ANILLOS MUJER -->
<div id="anillos-mujer" class="catalog">
  <div class="product">
    <img src="anillo-m1.jpg">
    <h3>Anillo Mujer 1</h3>
    <div class="price">$---</div>
    <a class="buy" href="https://wa.me/573XXXXXXXXX?text=¡Quiero%20comprar%20esta%20pieza!" target="_blank">Comprar</a>
  </div>
</div>

<!-- ANILLOS HOMBRE -->
<div id="anillos-hombre" class="catalog">
  <div class="product">
    <img src="anillo-h1.jpg">
    <h3>Anillo Hombre 1</h3>
    <div class="price">$---</div>
    <a class="buy" href="https://wa.me/573XXXXXXXXX?text=¡Quiero%20comprar%20esta%20pieza!" target="_blank">Comprar</a>
  </div>
</div>

<div class="socials">
  <a href="https://www.instagram.com/joyas_hermanas" target="_blank">Instagram</a>
  <a href="https://www.tiktok.com/@joyashermanascol" target="_blank">TikTok</a>
  <a href="https://wa.link/gljkhn" target="_blank">WhatsApp</a>
</div>

</div>

<footer>JoyasHermanas™ • 2026</footer>

<script>
function openCatalog(id){
  document.querySelectorAll('.catalog').forEach(c=>c.classList.remove('active'));
  const section = document.getElementById(id);
  section.classList.add('active');
  window.scrollTo({top: section.offsetTop - 60, behavior: 'smooth'});
}
</script>

</body>
</html>
